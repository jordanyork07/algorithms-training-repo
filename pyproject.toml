[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms-training-repo"
version = "0.1.0"
description = "Python algorithm interview practice repo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "black==24.8.0",
  "ruff==0.6.8",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
